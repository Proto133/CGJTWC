name: Deploy to Firebase Hosting

# The production deploy. trojanswrestlingclub.com is served from Firebase
# Hosting; the GitHub Pages workflow alongside this one publishes a noindexed
# duplicate and is kept only as a fallback.
#
# Runs the same type check and lint as the Pages build, so a broken commit
# cannot reach the live site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race; the later commit should win.
concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Pin npm to the lockfile's generator
        # Same reason as the Pages workflow: npm ci fails on other versions
        # with "Missing: @emnapi/core from lock file".
        run: npm i -g npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npx eslint -c ./eslint.config.js "./src/**/*.{ts,js,vue}"

      - name: Build
        env:
          # No PAGES_BASE here: Firebase serves from the domain root, so
          # publicPath stays "/". Setting it would break every asset path.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npx quasar build

      - name: Deploy
        # firebase.json lives at the repository root, not in client/.
        working-directory: ${{ github.workspace }}
        env:
          # Passed as an environment variable rather than interpolated into the
          # script, so the JSON cannot break shell quoting or be logged.
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 deploy --only hosting --project juniortrojanswc
          rm -f "$RUNNER_TEMP/sa.json"
